<!DOCTYPE html>
<html>

<head>

<title>PeopleWedding</title>

<style>

body {
    font-family: Arial, sans-serif;
    max-width: 600px;
    margin: 50px auto;
    padding: 20px;
}

input {
    width: 100%;
    padding: 12px;
    margin: 8px 0 15px;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    background: black;
    color: white;
    border: none;
    cursor: pointer;
}

#event {
    margin-top: 30px;
    padding: 20px;
    background: #f2f2f2;
    display: none;
}

#guestPage {
    margin-top: 30px;
    padding: 20px;
    background: #f2f2f2;
    display: none;
}

#gallery {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

#gallery img {
    width: 180px;
    border-radius: 10px;
}

#qrCode {
    margin-top: 20px;
}

</style>

</head>


<body>

<h1>PeopleWedding</h1>

<h2>Create Wedding Event</h2>

<label>
Couple Name
</label>

<input
id="name"
placeholder="Ery & Sara"
>

<label>
Wedding Date
</label>

<input
id="date"
type="date"
>

<label>
Location
</label>

<input
id="location"
placeholder="Kuala Lumpur"
>

<button id="create">
Create Wedding Event
</button>

<button id="guestButton">
GUEST
</button>


<div id="event">

<h2 id="eventName"></h2>

<p id="eventDate"></p>

<p id="eventLocation"></p>

</div>


<div id="guestPage">

<h2>📸 Guest Gallery</h2>

<h1 id="guestName"></h1>

<p id="eventId"></p>

<div id="qrCode"></div>

<p id="guestInfo">
Share your wedding photos with the couple.
</p>

<input
type="file"
id="guestPhotos"
accept="image/*"
multiple
>

<div id="gallery"></div>

</div>


<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


<script>

const nameInput =
document.getElementById("name");

const dateInput =
document.getElementById("date");

const locationInput =
document.getElementById("location");

const event =
document.getElementById("event");

const guestPage =
document.getElementById("guestPage");

const guestButton =
document.getElementById("guestButton");

const guestName =
document.getElementById("guestName");

const eventId =
document.getElementById("eventId");

const qrCode =
document.getElementById("qrCode");

const gallery =
document.getElementById("gallery");


// CREATE WEDDING EVENT

document
.getElementById("create")
.addEventListener("click", function() {

    let name =
    nameInput.value.trim();

    let date =
    dateInput.value;

    let location =
    locationInput.value.trim();


    if (name === "") {

        alert("Masukkan nama pengantin");

        return;

    }


    if (date === "") {

        alert("Pilih tarikh wedding");

        return;

    }


    if (location === "") {

        alert("Masukkan lokasi");

        return;

    }


    event
    .style.display = "block";


    document
    .getElementById("eventName")
    .innerText =
    "💍 " + name;


    document
    .getElementById("eventDate")
    .innerText =
    "📅 " + date;


    document
    .getElementById("eventLocation")
    .innerText =
    "📍 " + location;


    guestPage
    .style.display = "block";


    guestName
    .innerText =
    name;


    let year =
    new Date(date).getFullYear();


    let eventCode =
    name
    .toUpperCase()
    .replace(/\s*&\s*/g, "-")
    .replace(/\s+/g, "-")
    + "-" + year;


    eventId
    .innerText =
    "Event ID: " + eventCode;


    qrCode.innerHTML = "";


    let guestURL =
    window.location.origin +
    window.location.pathname +
    "?event=" +
    encodeURIComponent(eventCode);


    new QRCode(
        qrCode,
        {
            text: guestURL,
            width: 200,
            height: 200
        }
    );


    alert("Wedding Event Created!");

});


// GUEST BUTTON

guestButton.onclick = function() {

    guestPage
    .style.display = "block";

};


// PHOTO GALLERY

document
.getElementById("guestPhotos")
.addEventListener("change", function(event) {

    gallery.innerHTML = "";


    for (let file of event.target.files) {

        let img =
        document.createElement("img");


        img.src =
        URL.createObjectURL(file);


        gallery
        .appendChild(img);

    }

});


// OPEN EVENT FROM QR

const urlParams =
new URLSearchParams(
    window.location.search
);


const guestEvent =
urlParams.get("event");


if (guestEvent) {

    guestPage
    .style.display = "block";


    const guestNameFromQR =
    guestEvent
    .replace(/-\d{4}$/, "")
    .replace(/-/g, " & ");


    guestName
    .innerText =
    guestNameFromQR;


    eventId
    .innerText =
    "Event ID: " + guestEvent;


    document
    .getElementById("event")
    .style.display = "none";

}

</script>


</body>

</html>
